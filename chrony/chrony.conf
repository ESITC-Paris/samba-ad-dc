# chrony configuration for the Samba AD DC image.
#
# Baked into the image at /etc/chrony/chrony.conf and never edited at
# runtime: the root filesystem is read-only (adaptation profile B.2) and
# /etc/chrony is not one of the writable paths. Everything this daemon
# writes lives under /run/chrony (tmpfs) or /var/lib/samba/chrony (the
# state volume), both created by the entrypoint before chronyd starts.
#
# MS-SNTP time service for domain members (SPEC B.3): Windows clients
# ask their DC for time over NTP and expect the reply to carry a
# Microsoft authenticator signed with the machine account key. chronyd
# cannot sign that itself; it hands the packet to samba over this socket,
# which samba creates and serves.
ntpsigndsocket /var/lib/samba/ntp_signd

# Do not drop privileges to the packaged _chrony user. Two reasons, both
# observed rather than assumed:
#
#  1. Shutdown. The container's capability set is `cap_drop: ALL` plus the
#     seven capabilities the DC needs (adaptation profile B.2), and CAP_KILL
#     is deliberately not among them. A root entrypoint cannot signal a
#     process running under another UID without it, so a privilege-dropping
#     chronyd could not be stopped in order — SIGTERM came back
#     "operation not permitted" and the orderly shutdown degraded into a
#     kill that also failed.
#  2. The signing socket. /var/lib/samba/ntp_signd is created by samba on
#     the state volume and is not group-readable by _chrony, so MS-SNTP
#     signing would not work either.
#
# Nothing is lost by it: this container cannot run non-root at all (B.2 —
# the DC needs CAP_SYS_ADMIN for security.* xattrs), so chronyd would be
# the only privilege boundary inside an image that has none elsewhere.
user root

# Serve time to every client that can reach the DC. The container is not
# reachable from outside the domain network by construction (no NAT,
# dedicated IP per DC — adaptation profile B.3), so an address ACL here
# would duplicate the network boundary rather than add one.
allow all

driftfile /var/lib/samba/chrony/drift
pidfile /run/chrony/chronyd.pid

# No servers or pools are configured, on purpose. The container shares
# the host's clock and must not try to discipline it (the entrypoint
# starts chronyd with -x for the same reason): host time synchronization
# is the operator's responsibility, stated as a deployment constraint in
# adaptation profile B.3. `local stratum 10` is what makes chronyd serve
# that undisciplined clock anyway — without it a chronyd with no source
# refuses to answer, and every domain member would lose time service.
# Stratum 10 is the conventional "this is a local clock, prefer a real
# source if you have one" marker.
local stratum 10

# The NTP service port, stated explicitly so the image's EXPOSE 123/udp
# and this file cannot drift apart.
port 123

# No command/monitoring socket: chronyc is not shipped as an operating
# interface for this image, and a listening control port on a domain
# controller is attack surface with no operator use.
cmdport 0
