name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref: a force-push supersedes its own in-flight run rather
# than queueing behind it. Never cancels anything on another ref.
concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Linters run as digest-pinned containers; the human-readable tag is
      # kept in the reference so a bump is reviewable. Dependabot does not
      # track image refs inside `run:`, so these are bumped by hand when
      # the release notes justify it.
      HADOLINT_IMAGE: >-
        ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
      ACTIONLINT_IMAGE: >-
        rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: yamllint
        run: pipx run yamllint==1.38.0 --strict .

      - name: shellcheck
        run: |
          # The linter comes from the runner image, so it is pinned by
          # assertion rather than by version: ubuntu-24.04 ships 0.9.x and
          # a downgrade below that floor must be loud, while a runner-image
          # bump to a newer release stays green. (A comment may not open
          # with the tool's own name here - it would parse as a directive.)
          version=$(shellcheck --version | sed -n 's/^version: //p')
          echo "shellcheck ${version}"
          major=${version%%.*}
          minor=${version#*.}
          minor=${minor%%.*}
          if [ "${major}" -eq 0 ] && [ "${minor}" -lt 9 ]; then
            echo "::error::shellcheck ${version} is below the expected 0.9 floor"
            exit 1
          fi
          # Fail on an empty selection: a gate that lints nothing passes
          # vacuously, which is indistinguishable from a gate that works.
          # Both pathspecs, deduped: '*.sh' catches the tracked scripts and
          # 'test/**/*.sh' keeps the future test tree in scope explicitly,
          # so a script added under test/ can never be linted by accident
          # only.
          mapfile -t files < <(git ls-files '*.sh' 'test/**/*.sh' | sort -u)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no *.sh tracked - the shellcheck gate would pass vacuously"
            exit 1
          fi
          printf 'linting %d script(s)\n' "${#files[@]}"
          shellcheck "${files[@]}"

      - name: Traceability
        # SPEC §8.2/§10.6: docs/traceability.md and the E2E test functions
        # must be the same set, in both directions. It lives in `lint`
        # rather than in `build` because it reads two text files and needs
        # neither Go nor docker — a mismatch is reported in seconds,
        # before an hour of image builds.
        run: sh scripts/check-traceability.sh

      - name: hadolint
        run: |
          mapfile -t dockerfiles < <(git ls-files '*Dockerfile*')
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "::error::no Dockerfile tracked - the hadolint gate would pass vacuously"
            exit 1
          fi
          for dockerfile in "${dockerfiles[@]}"; do
            echo "hadolint ${dockerfile}"
            docker run --rm -i "${HADOLINT_IMAGE}" < "${dockerfile}"
          done

      - name: actionlint
        # Workflow-schema validation (expression syntax, runner labels,
        # action inputs) — none of which yamllint can see.
        run: |
          docker run --rm -v "${PWD}:/repo:ro" -w /repo "${ACTIONLINT_IMAGE}" -color

  unit:
    name: Unit (entrypoint)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          # The toolchain is chosen by entrypoint/go.mod, so this job and
          # the Dockerfile's gobuild stage cannot drift apart.
          go-version-file: entrypoint/go.mod
          cache-dependency-path: entrypoint/go.sum

      - name: gofmt, vet and unit tests
        working-directory: entrypoint
        run: |
          # The same three gates the gobuild stage runs inside the image
          # (SPEC §6.7). They live here as well because a failure on the
          # runner is readable in seconds, while the same failure inside a
          # 90-minute image build is not.
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt would rewrite: ${unformatted}"
            exit 1
          fi
          go vet ./...
          # -race here and not in the image build: the supervision and
          # shutdown tests run real goroutines against real signals, and the
          # runner has the cgo toolchain the detector needs.
          go test -race ./...

  build:
    name: Build (${{ matrix.arch }})
    needs: [lint, unit]
    runs-on: ${{ matrix.runner }}
    # Image build (Samba is built from source) plus the full E2E suite.
    # The suite alone takes ~8-15 min on a developer machine and is given
    # `-timeout 45m` because it provisions domains, joins a second DC and
    # waits for replication to converge; a runner is slower than a laptop
    # and pulls the upgrade reference image over the network. 90 covered
    # the build alone and would now cut the suite off mid-run, which is
    # the one failure mode that leaves no readable result.
    timeout-minutes: 120
    strategy:
      # Native runners per architecture: no QEMU, so an arch-specific
      # compile failure is reported by the leg that actually hit it.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Pin consistency
        run: sh scripts/check-pins-consistency.sh

      - name: Build image
        run: |
          # The package-index hash comes from the catalog, not from the
          # Dockerfile ARG default (which is only a fallback for a bare
          # `docker build .`): the watcher edits versions.yaml, and this is
          # what turns that edit into a busted apt layer (SPEC §9.3).
          pkg_index_hash=$(sh scripts/check-pins-consistency.sh --print pkg_index_hash)
          echo "pkg_index_hash=${pkg_index_hash}"
          docker build \
            --build-arg "PKG_INDEX_HASH=${pkg_index_hash}" \
            -t samba-ad-dc:ci .

      - name: Smoke
        run: |
          # --entrypoint is required from Phase 2 on: the image's ENTRYPOINT
          # is the Go state machine, which (correctly) refuses arguments it
          # does not understand instead of running them.
          expected=$(sh scripts/check-pins-consistency.sh --print samba_version)
          actual=$(docker run --rm --entrypoint samba samba-ad-dc:ci --version)
          echo "${actual} (versions.yaml pins ${expected})"
          case "${actual}" in
            *"${expected}"*) ;;
            *)
              echo "::error::samba reports '${actual}', versions.yaml pins ${expected}"
              exit 1
              ;;
          esac
          docker run --rm --entrypoint samba-tool samba-ad-dc:ci --help > /dev/null

          # The entrypoint's own report of the Samba version comes from the
          # -ldflags injection in the gobuild stage; the version guard on the
          # state volume is only as trustworthy as this value.
          reported=$(docker run --rm samba-ad-dc:ci --version)
          echo "${reported}"
          case "${reported}" in
            *"${expected}"*) ;;
            *)
              echo "::error::entrypoint reports '${reported}', versions.yaml pins ${expected}"
              exit 1
              ;;
          esac

          # An unconfigured container must refuse with the documented
          # configuration exit code, not start something.
          code=0
          docker run --rm -e SAMBA_MODE=run samba-ad-dc:ci || code=$?
          echo "run mode without a state volume exited ${code}"
          if [ "${code}" -ne 21 ]; then
            echo "::error::run mode without state exited ${code}, expected 21"
            exit 1
          fi

      - name: Label assertion
        run: |
          # The OCI labels are the image's only self-description once it is
          # pulled from a registry; a build-arg that silently stayed empty
          # would ship a label with an empty value, which reads as "present"
          # to anything that only checks for the key. Both are checked.
          labels=$(docker inspect --format '{{json .Config.Labels}}' samba-ad-dc:ci)
          echo "${labels}"
          required=(
            org.opencontainers.image.source
            org.opencontainers.image.version
            org.opencontainers.image.revision
            org.opencontainers.image.licenses
            org.opencontainers.image.description
            org.opencontainers.image.created
            org.opencontainers.image.base.name
            org.opencontainers.image.base.digest
            org.esitc-paris.spec-version
          )
          missing=0
          for key in "${required[@]}"; do
            value=$(printf '%s' "${labels}" | python3 -c \
              'import json,sys; print((json.load(sys.stdin) or {}).get(sys.argv[1], ""))' "${key}")
            if [ -z "${value}" ]; then
              echo "::error::image label ${key} is missing or empty"
              missing=$((missing + 1))
            else
              printf 'ok  %-45s = %s\n' "${key}" "${value}"
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "::error::${missing} required OCI label(s) missing or empty"
            exit 1
          fi
          printf 'all %d required labels present\n' "${#required[@]}"

      - name: Package closure check
        run: sh scripts/check-image-packages.sh samba-ad-dc:ci

      - name: Set up Go
        # The E2E suite is a Go test binary, so this job needs a toolchain
        # too — the same pinned action the `unit` job uses, resolved from
        # the e2e module's own go.mod so the two modules can pick their
        # toolchains independently.
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: test/e2e/go.mod
          # The e2e module has no external dependencies (and therefore no
          # go.sum): there is nothing to cache, and pointing the cache at
          # a file that does not exist fails the step.
          cache: false

      - name: Build test-client image
        # The protocol client (kinit, smbclient, ldapsearch, dig, ntpdate)
        # that drives the DC over the network. The harness builds it
        # lazily on a developer machine; here it is a step of its own so a
        # client-image failure is reported as one, and so it is not
        # rebuilt inside the suite's own timeout.
        run: docker build -t samba-ad-dc-e2e-client:ci test/client

      - name: E2E suite
        working-directory: test/e2e
        env:
          # The suite must never build or pull its own subject — it tests
          # the image this job just built, by name.
          E2E_IMAGE: samba-ad-dc:ci
          E2E_CLIENT_IMAGE: samba-ad-dc-e2e-client:ci
        run: |
          # `-count=1` defeats the test cache: these tests talk to docker,
          # so a cached PASS would be a statement about a previous run's
          # containers. `-timeout 45m` is required, not decoration — the
          # 10-minute default panics the process mid-suite, which skips
          # every t.Cleanup and leaks containers, volumes and networks.
          #
          # Run from test/e2e (its own module, outside the image build's
          # context) so the package pattern resolves without the
          # workspace file.
          #
          # E2E_UPGRADE_FROM is deliberately unset: no tag of this branch
          # is published yet, so TestUpgradeFromLastPublished skips loudly
          # naming the variable (SPEC §8.3). Set it here as soon as the
          # first tag exists.
          go test ./... -v -timeout 45m -count=1
