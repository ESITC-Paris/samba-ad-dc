name: Capability bisection

# Manual only, and deliberately so. This workflow does not verify a change:
# it MEASURES a property of the image — the minimal Linux capability set the
# domain controller needs (SPEC §5.2, adaptation-profile B.2) — by running
# the E2E smoke subset once per capability with that capability taken away.
# That is roughly seven full provisions per architecture, so it is an hour
# of runner time per leg and has no business running on every push. It is
# run when the capability set is in question: a new Samba major, a change to
# what the entrypoint does at boot, or a review that asks "is SYS_ADMIN
# really needed?".
#
# Its output is a report artifact, not a commit. The findings are applied to
# docs/adaptation-profile.md B.2 by a pull request that cites the run.
on:
  workflow_dispatch:

permissions:
  contents: read

# Two legs of this workflow measure the same thing on two kernels, which is
# the point; two RUNS of it would only compete for runners. A second dispatch
# waits for the first rather than cancelling it — a bisection killed halfway
# produces a report with holes in it, which is worse than a late report.
concurrency:
  group: "capbisect-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  bisect:
    name: Bisect (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # The job budget covers a cold image build (ci.yml budgets 90 minutes for
    # exactly that step) plus the bisection. The 60-minute budget that bounds
    # the measurement itself is on the bisection step, where it belongs: a
    # bisection that overruns must fail as a bisection, not as "the job ran
    # out of time somewhere".
    timeout-minutes: 180
    strategy:
      # Native runners per architecture. This is not a formality here: a
      # capability check is kernel code, and "is SYS_ADMIN required" is a
      # question two architectures may legitimately answer differently.
      # fail-fast off so one arch's answer is never lost to the other's.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: test/e2e/go.mod
          # The suite has no third-party dependencies and therefore no
          # go.sum; setup-go's cache wants one and warns without it.
          cache: false

      - name: Pin consistency
        # Parity with the CI build job. A catalog that disagrees with the
        # Dockerfile builds a different image than the one anybody thinks
        # is under test, and this workflow's whole output is a claim about
        # a specific image.
        run: sh scripts/check-pins-consistency.sh

      - name: Build image
        run: |
          # Same build the CI build job does, including the package-index
          # hash from the catalog: the capability verdicts are statements
          # about a specific image, so it has to be built the specific way.
          pkg_index_hash=$(sh scripts/check-pins-consistency.sh --print pkg_index_hash)
          echo "pkg_index_hash=${pkg_index_hash}"
          docker build \
            --build-arg "PKG_INDEX_HASH=${pkg_index_hash}" \
            -t samba-ad-dc:dev .

      - name: Build test client
        run: |
          # The harness builds this itself on first use; doing it here keeps
          # the build out of the first run's timing, which would otherwise
          # make the baseline look slower than every run after it.
          docker build -t samba-ad-dc-e2e-client:dev test/client

      - name: Clear committed reports from the workspace
        # The repository CARRIES a committed record for one architecture
        # (test/capbisect/results-arm64.txt). On that leg the checkout puts
        # it in the workspace before the bisection has measured anything,
        # and an artifact step could then upload a file from git history as
        # if it were this run's result. Deleting it first means every file
        # uploaded below was necessarily produced by this run.
        run: rm -f test/capbisect/results-*.txt

      - name: Bisect
        # 90, not 60: two of the drop-one verdicts are reached only by
        # letting a health wait expire, and each of those is now run twice
        # (the confirmation re-run that keeps a flake from becoming a
        # verdict). The per-run `go test -timeout` inside the driver is 40
        # minutes, so a budget below that could cut a single run in half
        # and report it as an infrastructure failure.
        timeout-minutes: 90
        run: sh test/capbisect/bisect.sh

      - name: Upload this run's report
        # Runs even when the bisection failed — which is exactly when it
        # matters. The driver writes the report incrementally: the header
        # lands before the first container starts and every verdict is
        # appended the moment it is measured, so a cancelled, timed-out or
        # aborted run still leaves the verdicts it reached.
        #
        # The path is the DATED file, which only exists once a run has
        # begun writing, and it is scoped to this leg's architecture. Both
        # details make `if-no-files-found: error` mean something: it fails
        # when this leg produced nothing, instead of passing quietly
        # because the repository happens to carry a committed report from
        # another architecture.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: capbisect-run-${{ matrix.arch }}
          path: test/capbisect/results-${{ matrix.arch }}-*.txt
          if-no-files-found: error
          retention-days: 90

      - name: Upload the stable copy
        # Separate step, separate artifact: this is the file a PR would
        # commit as the new record, and it must not be able to satisfy the
        # guard above. `warn` rather than `error` because the driver writes
        # it last — a run that died mid-bisection legitimately has none.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: capbisect-stable-${{ matrix.arch }}
          path: test/capbisect/results-${{ matrix.arch }}.txt
          if-no-files-found: warn
          retention-days: 90
