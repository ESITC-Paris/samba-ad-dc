# Versions catalog — the single source of truth for what gets built.
#
# Consumed by: the Dockerfile build args (Phase 1), CI (Phase 4) and the
# release watcher (Phase 6). Every value here is a pin: nothing in the
# build resolves a "latest" anything.
#
# tarball_sha256 is the SHA-256 of the shipped samba-<version>.tar.gz.
# Upstream signs the *uncompressed* tar, so provenance is established by
# verifying samba-<version>.tar.asc against keys/samba-release-key.asc
# (fingerprint 81F5E2832BD2545A1897B713AA99442FB680B620, see
# keys/PINNING.md) over the gunzipped tar; this checksum then pins the
# exact compressed artifact the build downloads. Every checksum below was
# produced by `sh scripts/verify-upstream-tarball.sh <X.Y.Z>`, which runs
# that same verification chain locally before the value lands here.
#
# Branches are listed newest first for reading; order carries no meaning —
# every consumer sorts numerically. The lifecycle note on each branch is
# upstream's status as observed on the date it names: this repository
# relays that status (§9.4), it never decides it, and the watcher is what
# refreshes it.
#
# Those notes are a human-readable restatement, kept in step BY HAND. The
# published compatibility matrix is not written from them: it is rendered
# by `catalog.py render-matrix`, which derives the lifecycle label from
# this file's branch list positionally (newest = current, then
# maintenance, then security fixes only) and appends the §9.4
# deprecation-pending suffix when a newer series has a release candidate.
# A comment below that has drifted is a stale comment, never a wrong
# matrix — but it is still a comment to fix.
---
default_branch: "4.24"
branches:
  # 2026-09-16: current stable series upstream.
  "4.24":
    samba_version: "4.24.7"
    revision: 1  # the N in X.Y.Z-rN
    tarball_sha256: "45b7747a47452eff2b2159a44cc63eb43690d339fd1069088e023a015fed06c7"
    base:
      builder: "debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132"
      runtime: "debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132"
      # Toolchain for the Go entrypoint stage; entrypoint/go.mod declares
      # `go 1.25.0`, so 1.25 is the floor — but the floor is not what
      # fixes this pin. A Go binary carries the stdlib it was compiled
      # with, so this value decides which toolchain CVEs ship inside the
      # entrypoint: 1.24 (stdlib 1.24.13) carried 19 fixable HIGH
      # findings, all fixed in 1.25.8..1.25.13. Pinned at 1.25 for that
      # reason; the go.mod floor followed, it did not lead.
      gobuild: "golang:1.25-trixie@sha256:2c4c60ef415fbfa5e90300722293bef36c5e63fae17570ce18f580af933dbd73"
    pkg_index_hash: "6b233ad0c4404928"  # replaced by the watcher from Phase 6 on
  # 2026-09-16: maintenance series upstream (bug fixes and security fixes).
  "4.23":
    samba_version: "4.23.12"
